name: Test & Deploy

on:
  push:
    branches: [trunk]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run test:e2e:install

      - run: npm run lint
      - run: npm run typecheck

      - run: npm test

      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: test-and-deploy
    runs-on: self-hosted
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
